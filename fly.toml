app = "normalizer-app"
primary_region = "sjc"

[build]
  dockerfile = "infra/server.Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SERVER_BASE_URL = "https://www.normalizer.app"
  VAULT_ADDR = "https://vault.chrisvouga.dev"
  VAULT_MOUNT = "secret"
  VAULT_PROJECT = "personal"
  VAULT_CONFIG = "prd"
  # Jobs run on the separate normalizer-app-worker app (see fly.worker.toml), so
  # this web app must not process them in-process and starve its event loop.
  DISABLE_IN_PROCESS_WORKER = "true"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 8080
  force_https = true
  # Scale the web app to zero when idle; Fly Proxy auto-starts it on the next
  # request. Background jobs run on normalizer-app-worker, which stays awake.
  # Using "stop" (not "suspend") to avoid stale-loopback/DB resume issues.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health/live"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
