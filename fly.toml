app = "normalizer-app"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SERVER_BASE_URL = "https://www.normalizer.app"
  VAULT_ADDR = "https://vault.chrisvouga.dev"
  VAULT_MOUNT = "secret"
  VAULT_PROJECT = "personal"
  VAULT_CONFIG = "prd"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health/live"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
