# Background worker app. Runs the Graphile Worker (normalization jobs) on its
# own Fly app/machine so CPU/memory-heavy work (PGlite WASM, tabular parsing,
# LLM calls) can't starve the web server (normalizer-app) event loop.
#
# This app has NO public service, so Fly Proxy never auto-stops it: the single
# machine stays awake continuously to poll the job queue. Keep it at exactly one
# machine (the deploy script runs `fly scale count 1`).
#
# Same Docker image as the web app; only the start command differs.
app = "normalizer-app-worker"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  SERVER_BASE_URL = "https://www.normalizer.app"
  VAULT_ADDR = "https://vault.chrisvouga.dev"
  VAULT_MOUNT = "secret"
  VAULT_PROJECT = "personal"
  VAULT_CONFIG = "prd"
  # Number of concurrent normalization jobs. Each spins up its own PGlite (WASM
  # Postgres) instance, so keep this in line with the VM memory below.
  WORKER_CONCURRENCY = "3"

# Override the image CMD to run the worker entrypoint. Named "app" so the
# default process group works with `fly scale count 1`.
[processes]
  app = "bun run src/worker.tsx"

# Dedicated CPU + extra RAM for PGlite/normalization. No public service.
[[vm]]
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 2
